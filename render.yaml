# Render Blueprint — 智退险官网（免费静态站点）
# 用法：Render 控制台 → New → Blueprint → 选择本仓库，按提示填入 PUBLIC_DIFY_API_KEY
# 文档：https://render.com/docs/blueprint-spec
services:
  - type: web
    name: zhituixian-website
    runtime: static
    # Astro 静态站：安装依赖 → 同步模型数据 → 构建 dist/ → 用语扫描
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    envVars:
      # 锁定 Node 版本（package.json engines 要求 >= 22.12.0）
      - key: NODE_VERSION
        value: "22.12.0"
      # Dify AI 客服：地址非机密，直接写在蓝图里
      - key: PUBLIC_DIFY_API_BASE
        value: https://api.dify.ai/v1
      # Dify API 密钥：不写入仓库，部署时在 Render 后台填写
      - key: PUBLIC_DIFY_API_KEY
        sync: false
